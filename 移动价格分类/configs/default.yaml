seed: 42
device: cuda
exp_name: baseline

data:
  train_csv: ./data/raw/train.csv
  test_csv: ./data/raw/test.csv
  label_col: price_range
  batch_size: 64
  num_workers: 0
  val_ratio: 0.15
  num_classes: 4

model:
  name: mlp
  hidden_dims: [128, 64]
  dropout: 0.3

loss:
  name: cross_entropy
  label_smoothing: 0.0

optimizer:
  name: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4

scheduler:
  name: cosine
  warmup_epochs: 2
  min_lr: 1.0e-6

train:
  epochs: 30
  grad_clip: 1.0
  early_stop_patience: 5
  save_dir: ./outputs
  log_interval: 10